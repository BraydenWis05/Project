<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Side Quest Screens</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Space+Mono&display=swap" rel="stylesheet" />
<style>
:root{--orange:#F45B35;--paper:#F4EBD8;--lime:#C8E65A;--blue:#4444DB;--ink:#252525}
*{box-sizing:border-box;margin:0}
body{background:#e9e0cc;color:var(--ink);font:15px/1.4 Archivo,sans-serif;padding:48px 16px}
.d{font-weight:900;font-stretch:72%;text-transform:uppercase;line-height:.9;letter-spacing:-.01em}
.m{font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.04em}
.row{display:flex;flex-wrap:wrap;gap:32px;justify-content:center}
figure{display:flex;flex-direction:column;gap:10px}
.phone{width:300px;height:620px;border-radius:36px;background:var(--paper);overflow:hidden;
  display:flex;flex-direction:column;padding:52px 20px 22px;gap:16px;box-shadow:0 1px 0 rgba(0,0,0,.1),0 20px 40px -20px rgba(0,0,0,.35)}
.btn{border-radius:14px;padding:15px;text-align:center;font-weight:700;border:2px solid var(--ink)}
.photo{border-radius:10px;background:repeating-linear-gradient(135deg,#d8ccb4 0 8px,#cfc2a8 8px 16px)}
hr{border:0;border-top:1.5px solid var(--ink);opacity:.15}
</style>
</head>
<body>
<div class="row">

<figure><div class="phone">
  <p class="m">7 quests done</p>
  <h1 class="d" style="font-size:64px">Bored?<br>Good.</h1>
  <div style="margin-top:auto;display:flex;flex-direction:column;gap:10px">
    <div class="btn" style="background:var(--orange);color:var(--paper);border-color:var(--orange);font-size:17px">Start a quest</div>
    <div class="btn">Play with friends</div>
  </div>
  <hr>
  <div>
    <p class="m" style="opacity:.6">In progress · 2 of 4 in</p>
    <p style="font-weight:700">The Accidental Album Cover</p>
  </div>
</div><figcaption class="m">Home</figcaption></figure>

<figure><div class="phone" style="background:var(--blue);color:var(--paper)">
  <p class="m">Nº 024 — Creativity</p>
  <div style="background:var(--paper);color:var(--ink);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:14px;flex:1;rotate:-1.5deg">
    <h2 class="d" style="font-size:40px">The accidental album cover</h2>
    <p>Make an album cover from three things you can find nearby.</p>
    <p class="m" style="opacity:.6">5–10 min · photo</p>
    <p style="margin-top:auto;border-top:1.5px dashed var(--ink);padding-top:12px"><b>Bonus:</b> give it a ridiculous name.</p>
  </div>
  <div style="display:flex;gap:10px">
    <div class="btn" style="border-color:var(--paper);flex:1">Reroll</div>
    <div class="btn" style="background:var(--lime);color:var(--ink);border-color:var(--lime);flex:2">Go</div>
  </div>
</div><figcaption class="m">Mission</figcaption></figure>

<figure><div class="phone">
  <div style="display:flex;justify-content:space-between" class="m"><span>Album Cover</span><span>12 min left</span></div>
  <h2 class="d" style="font-size:40px">3 takes in</h2>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
    <div><div class="photo" style="height:130px"></div><p class="m" style="margin-top:6px">maya — Peel Era</p></div>
    <div><div class="photo" style="height:130px;outline:3px solid var(--orange);outline-offset:-3px"></div><p class="m" style="margin-top:6px">jules — Sock Wave</p></div>
    <div><div class="photo" style="height:130px"></div><p class="m" style="margin-top:6px">you — Fern Gully</p></div>
    <div style="height:130px;border-radius:10px;border:1.5px dashed rgba(0,0,0,.3);display:grid;place-items:center" class="m">dev…</div>
  </div>
  <div class="btn" style="margin-top:auto;background:var(--ink);color:var(--paper)">Vote for jules</div>
</div><figcaption class="m">Gallery</figcaption></figure>

<figure><div class="phone" style="background:var(--orange);color:var(--paper)">
  <p class="m">Quest complete</p>
  <h2 class="d" style="font-size:52px">Jules<br>wins.</h2>
  <div class="photo" style="flex:1;background:repeating-linear-gradient(135deg,#f7d9c8 0 8px,#f2cbb6 8px 16px)"></div>
  <p class="m">"Sock Wave" · 3 votes · 4 players</p>
  <div style="display:flex;gap:10px">
    <div class="btn" style="border-color:var(--paper);flex:1">Share</div>
    <div class="btn" style="background:var(--paper);color:var(--ink);border-color:var(--paper);flex:1">One more</div>
  </div>
</div><figcaption class="m">Results</figcaption></figure>

</div>
</body>
</html>
